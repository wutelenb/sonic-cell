name: deploy
on:
  push:
    branches: [main]
permissions:
  pages: write
  id-token: write
  contents: read
  administration: write
# Pages 已在仓库设置中手动开启（Source: GitHub Actions）
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
